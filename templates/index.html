<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Search Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }
        
        .logo {
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #4285f4;
        }
        
        .logo span:nth-child(1) { color: #4285f4; }
        .logo span:nth-child(2) { color: #ea4335; }
        .logo span:nth-child(3) { color: #fbbc05; }
        .logo span:nth-child(4) { color: #4285f4; }
        .logo span:nth-child(5) { color: #34a853; }
        .logo span:nth-child(6) { color: #ea4335; }
        
        .search-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .search-box {
            display: flex;
            width: 100%;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 10px 20px;
            background: white;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.1);
        }
        
        .search-box:hover {
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.2);
        }
        
        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 5px;
        }
        
        .search-button {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 10px 20px;
            cursor: pointer;
            margin: 5px;
        }
        
        .search-button:hover {
            border: 1px solid #dadce0;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
        }
        
        .buttons {
            margin-top: 10px;
        }
        
        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #f2f2f2;
            padding: 15px;
            text-align: center;
            font-size: 14px;
            color: #70757a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">
            <span>S</span><span>e</span><span>a</span><span>r</span><span>c</span><span>h</span>
        </h1>
        
        <form class="search-form" action="/search" method="GET">
            <div class="search-box">
                <input type="text" name="q" class="search-input" 
                       placeholder="Enter your search query..." 
                       autocomplete="off" autofocus>
            </div>
            <div class="buttons">
                <button type="submit" class="search-button">Search</button>
            </div>
        </form>
    </div>
    
    <footer>
        <p>Web Search Engine - Information Retrieval Project</p>
    </footer>
</body>
</html>
