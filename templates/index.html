<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Term Project Search Engine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
        }
        .search-container {
            text-align: center;
            width: 100%;
            max-width: 600px;
        }
        .logo {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 30px;
            color: #0d6efd;
        }
    </style>
</head>
<body>

<div class="container search-container">
    <div class="logo">🔍 My Search Engine</div>
    
    <form action="/search" method="get">
        <div class="input-group input-group-lg mb-3">
            <input type="text" name="q" class="form-control" placeholder="Search specific topic..." required autofocus>
            <button class="btn btn-primary" type="submit">Search</button>
        </div>
        <div class="form-text text-muted">
            Tip: Try phrase search like <code>"exact phrase"</code>
        </div>
    </form>

    <div class="text-center mt-5">
        <a href="/about" class="text-decoration-none text-muted small">About this engine</a>
    </div>

</div>

</body>
</html>
